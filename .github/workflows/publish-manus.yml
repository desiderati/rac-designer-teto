name: Publish Manus website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit exato a publicar (opcional; vazio usa o commit do disparo)"
        required: false
        type: string

concurrency:
  group: manus-publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-and-publish:
    name: Sync and publish Manus project
    # Checkpoints/publicações do próprio Manus podem gerar um push de volta
    # ao GitHub. Eles já estão publicados e não devem iniciar outro ciclo.
    if: github.actor != 'manus-connector[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MANUS_API_URL: https://api.manus.ai
      # Projeto WebDev e sessão que possui autorização de edição sobre ele.
      MANUS_WEBDEV_PROJECT_ID: NTjLBNvKDjXznaYrpeVMoY
      MANUS_WEBDEV_TASK_ID: aG5BaRM3JRZoPIZ0e8Tmf9
      REPOSITORY: desiderati/rac-designer-teto
      BRANCH: main

    steps:
      - name: Validate required secret
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MANUS_API_KEY" ]; then
            echo "::error::Configure o segredo MANUS_API_KEY em Settings > Secrets and variables > Actions antes de usar a publicação automática."
            exit 1
          fi

      - name: Validate WebDev session
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            "$MANUS_API_URL/v2/website.status?task_id=$MANUS_WEBDEV_TASK_ID" \
            -H "x-manus-api-key: $MANUS_API_KEY")
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            error_code=$(jq -r '(.error.code // "não informado") | tostring | gsub("[^A-Za-z0-9_.-]"; "_") | .[0:120]' "$response_file" 2>/dev/null || echo "resposta_invalida")
            echo "::error::A sessão WebDev não está disponível; HTTP $http_status; código: $error_code."
            echo "::error::Sessão esperada: $MANUS_WEBDEV_TASK_ID; projeto esperado: $MANUS_WEBDEV_PROJECT_ID."
            exit 1
          fi
          website_id=$(jq -r '.website_id // empty' "$response_file")
          if [ -z "$website_id" ]; then
            echo "::error::A sessão existe, mas não possui um WebDev anexado."
            exit 1
          fi
          echo "WebDev session validated: task=$MANUS_WEBDEV_TASK_ID website=$website_id project=$MANUS_WEBDEV_PROJECT_ID"

      - name: Request Manus sync and publication
        id: manus_task
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual publication' }}
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          defer_publication() {
            echo "::warning::Publicação adiada: $1. Nenhuma mensagem de sincronização foi enviada ao Manus."
            {
              echo '### Manus publication deferred'
              echo "- Commit pendente: \`$COMMIT_SHA\`"
              echo "- Motivo: \`$1\`"
              echo '- Não publicado. Após salvar o trabalho e liberar a sessão Manus, execute este workflow manualmente com o SHA desejado (ou faça um novo push).'
            } >> "$GITHUB_STEP_SUMMARY"
            # Um adiamento não pode aparecer como publicação bem-sucedida.
            exit 1
          }

          # A leitura de estado reduz o risco, mas não é um lock da sessão.
          if ! http_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            "$MANUS_API_URL/v2/task.detail?task_id=$MANUS_WEBDEV_TASK_ID" \
            -H "x-manus-api-key: $MANUS_API_KEY"); then
            defer_publication DEFERRED_TASK_STATE_UNKNOWN
          fi
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            defer_publication DEFERRED_TASK_STATE_UNKNOWN
          fi
          if ! jq -e --arg task_id "$MANUS_WEBDEV_TASK_ID" '
            .ok == true and .task.id == $task_id
            and (.task.status | type == "string")
            and (.task.has_running_background_jobs | type == "boolean")
          ' "$response_file" >/dev/null 2>&1; then
            defer_publication DEFERRED_TASK_STATE_UNKNOWN
          fi
          if ! jq -e '.task.status == "stopped" and .task.has_running_background_jobs == false' "$response_file" >/dev/null; then
            defer_publication DEFERRED_TASK_NOT_IDLE
          fi

          safe_sync_script=$(cat <<'SH'
          set -euo pipefail
          target_sha="$1"
          mode="${2:-sync}"
          defer_sync() { echo "$1"; exit 75; }
          assert_checkout_idle() {
            local branch marker marker_path worktree_status
            branch=$(git symbolic-ref --quiet --short HEAD) || defer_sync DEFERRED_CHECKOUT_STATE_UNKNOWN
            [ "$branch" = main ] || defer_sync DEFERRED_CHECKOUT_STATE_UNKNOWN
            for marker in MERGE_HEAD CHERRY_PICK_HEAD REVERT_HEAD rebase-merge rebase-apply sequencer index.lock; do
              marker_path=$(git rev-parse --git-path "$marker") || defer_sync DEFERRED_CHECKOUT_STATE_UNKNOWN
              [ ! -e "$marker_path" ] || defer_sync DEFERRED_GIT_OPERATION_IN_PROGRESS
            done
            worktree_status=$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none) || defer_sync DEFERRED_CHECKOUT_STATE_UNKNOWN
            [ -z "$worktree_status" ] || defer_sync DEFERRED_DIRTY_CHECKOUT
          }
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || defer_sync DEFERRED_CHECKOUT_STATE_UNKNOWN
          [[ "$mode" = sync || "$mode" = verify ]] || defer_sync DEFERRED_CHECKOUT_STATE_UNKNOWN
          assert_checkout_idle
          if [ "$mode" = sync ]; then
            git fetch user_github main || defer_sync DEFERRED_REMOTE_STATE_UNKNOWN
            remote_sha=$(git rev-parse --verify 'refs/remotes/user_github/main^{commit}') || defer_sync DEFERRED_REMOTE_STATE_UNKNOWN
            [ "$remote_sha" = "$target_sha" ] || defer_sync DEFERRED_REMOTE_SHA_CHANGED
            git merge-base --is-ancestor HEAD "$target_sha" || defer_sync DEFERRED_CHECKOUT_DIVERGED
            assert_checkout_idle
            git merge --ff-only --no-autostash --no-overwrite-ignore "$target_sha" || defer_sync DEFERRED_UNSAFE_UPDATE
          fi
          current_sha=$(git rev-parse --verify HEAD) || defer_sync DEFERRED_CHECKOUT_STATE_UNKNOWN
          [ "$current_sha" = "$target_sha" ] || defer_sync DEFERRED_CHECKOUT_SHA_CHANGED
          assert_checkout_idle
          SH
          )
          result_schema=$(cat <<'JSON'
          {
            "type": "object",
            "properties": {
              "status": {"type": "string", "enum": ["success", "failure"]},
              "commit_sha": {"type": "string"},
              "webdev_project_id": {"type": "string"},
              "checkpoint_id": {"type": ["string", "null"]},
              "published": {"type": "boolean"},
              "error_code": {"type": ["string", "null"]}
            },
            "required": ["status", "commit_sha", "webdev_project_id", "checkpoint_id", "published", "error_code"],
            "additionalProperties": false
          }
          JSON
          )
          # Pequena margem para tolerar diferença de relógio entre GitHub e API.
          request_started_at=$(( $(date +%s%3N) - 5000 ))
          prompt=$(cat <<EOF
          Esta é uma sessão WebDev existente e já validada pelo workflow.
          Projeto WebDev obrigatório: ${MANUS_WEBDEV_PROJECT_ID}
          Repositório fonte: ${REPOSITORY}
          Branch: ${BRANCH}
          Commit obrigatório: ${COMMIT_SHA}
          Mensagem do commit: ${COMMIT_MESSAGE}
          Diretório do projeto WebDev: /home/ubuntu/editor-planta-baixa

          Execute exatamente este fluxo, sem pedir confirmação e sem criar alterações de produto:
          1. Antes de qualquer operação Git, execute webdev_check_status e confirme que a sessão atual está anexada ao projeto WebDev ${MANUS_WEBDEV_PROJECT_ID}, no diretório /home/ubuntu/editor-planta-baixa. Se o projeto não estiver anexado, ou o projectId/path não corresponderem, não inicialize projeto novo, não use webdev_init_project, não faça fetch e não crie checkpoint; encerre com status=failure e error_code=WEBDEV_PROJECT_NOT_ATTACHED.
          2. No diretório confirmado, execute literalmente o script Bash abaixo, passando ${COMMIT_SHA} como primeiro argumento e sync como segundo. Não reescreva nem contorne as proteções. Se sair com código 75, encerre sem build, checkpoint ou publicação: status=failure e error_code igual ao código DEFERRED_* impresso. Qualquer estado incerto também exige adiamento. Não faça reset, clean, stash, checkout forçado, resolução de conflitos ou descarte de arquivos. Preserve os arquivos ignorados de infraestrutura; arquivos não rastreados visíveis exigem adiamento.

          ${safe_sync_script}

          3. Execute pnpm check e pnpm build. Se qualquer validação falhar, não publique e retorne status=failure.
          4. Imediatamente antes de salvar o checkpoint, execute o mesmo script com ${COMMIT_SHA} e verify. Ele deve confirmar HEAD exato e checkout ainda limpo, sem fetch nem atualização. Se falhar, adie a publicação como no passo 2. Se notar edição ou atividade humana concorrente em qualquer etapa, pare e retorne DEFERRED_CONCURRENT_ACTIVITY.
          5. Salve um checkpoint do projeto WebDev ${MANUS_WEBDEV_PROJECT_ID} com uma mensagem que contenha o SHA ${COMMIT_SHA} e indique que a origem foi um push do GitHub.
          6. Confirme o identificador do checkpoint e que a publicação foi iniciada ou concluída pelo WebDev. Não declare published=true sem evidência do WebDev.

          Não faça commit, push, alterações cosméticas, migrações ou mudanças fora desse fluxo.
          Ao terminar, produza um resultado estruturado com exatamente estes campos:
          status, commit_sha, webdev_project_id, checkpoint_id, published, error_code.
          Em sucesso ou falha, use commit_sha=${COMMIT_SHA} e webdev_project_id=${MANUS_WEBDEV_PROJECT_ID}.
          Para sucesso, use status=success, checkpoint_id preenchido, published=true e error_code=null.
          Para falha, use status=failure, checkpoint_id=null, published=false e error_code não nulo e curto.
          EOF
          )
          payload=$(jq -n \
            --arg task_id "$MANUS_WEBDEV_TASK_ID" \
            --arg content "$prompt" \
            --argjson schema "$result_schema" \
            '{
              task_id: $task_id,
              message: {content: $content},
              structured_output_schema: $schema
            }')
          http_status=$(curl --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            -X POST "$MANUS_API_URL/v2/task.sendMessage" \
            -H "x-manus-api-key: $MANUS_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload")
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            error_code=$(jq -r '(.error.code // "não informado") | tostring | gsub("[^A-Za-z0-9_.-]"; "_") | .[0:120]' "$response_file" 2>/dev/null || echo "resposta_invalida")
            request_id=$(jq -r '(.request_id // "não informado") | tostring | gsub("[^A-Za-z0-9_.-]"; "_") | .[0:120]' "$response_file" 2>/dev/null || echo "resposta_invalida")
            echo "::error::Manus retornou HTTP $http_status ao retomar a sessão WebDev; código: $error_code; request_id: $request_id."
            exit 1
          fi
          task_id=$(jq -er '.task_id' "$response_file")
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "request_started_at=$request_started_at" >> "$GITHUB_OUTPUT"
          echo "Resumed WebDev task: $task_id; events since: $request_started_at"

      - name: Wait for Manus publication
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          TASK_ID: ${{ steps.manus_task.outputs.task_id }}
          REQUEST_STARTED_AT: ${{ steps.manus_task.outputs.request_started_at }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          validate_result() {
            local structured="$1"
            local value success extraction_error result_status result_sha result_project checkpoint_id published error_code

            if ! echo "$structured" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::Resultado estruturado não é um objeto JSON válido."
              exit 1
            fi

            # Formato envelopado: {success, value, error}.
            # O valor pode ser uma falha operacional válida mesmo quando a
            # extração do envelope vier com success=false.
            if echo "$structured" | jq -e 'has("success")' >/dev/null 2>&1; then
              if ! echo "$structured" | jq -e '.success | type == "boolean"' >/dev/null 2>&1; then
                echo "::error::Envelope estruturado inválido: success deve ser booleano."
                exit 1
              fi
              success=$(echo "$structured" | jq -r '.success // false')
              extraction_error=$(echo "$structured" | jq -r '.error // empty')
              value=$(echo "$structured" | jq -c '.value // {}')

              if [ "$success" != "true" ]; then
                if ! echo "$value" | jq -e '
                  type == "object"
                  and (has("status") and has("commit_sha") and has("webdev_project_id") and has("checkpoint_id") and has("published") and has("error_code"))
                  and .status == "failure"
                  and (.commit_sha | type == "string")
                  and (.webdev_project_id | type == "string")
                  and (.published | type == "boolean")
                  and (.error_code == null or (.error_code | type == "string"))
                ' >/dev/null 2>&1; then
                  echo "::error::A extração do resultado estruturado falhou."
                  if [ -n "$extraction_error" ]; then
                    echo "::error::$extraction_error"
                  else
                    echo "::error::Erro sem detalhes adicionais."
                  fi
                  exit 1
                fi
              fi
            # Payload legado observado: {value: {status, commit_sha, ...}},
            # sem os campos success/error do envelope oficial.
            elif echo "$structured" | jq -e '(.value | type) == "object" and (.value.status != null)' >/dev/null 2>&1; then
              value=$(echo "$structured" | jq -c '.value')
            # Formato direto: {status, commit_sha, webdev_project_id, ...}.
            else
              value="$structured"
            fi

            if ! echo "$value" | jq -e '
              type == "object"
              and (has("status") and has("commit_sha") and has("webdev_project_id") and has("checkpoint_id") and has("published") and has("error_code"))
              and (.status | type == "string")
              and (.commit_sha | type == "string")
              and (.webdev_project_id | type == "string")
              and (.checkpoint_id == null or (.checkpoint_id | type == "string"))
              and (.published | type == "boolean")
              and (.error_code == null or (.error_code | type == "string"))
            ' >/dev/null 2>&1; then
              echo "::error::Resultado estruturado inválido ou incompleto."
              echo "$value" | jq -c .
              exit 1
            fi

            result_status=$(echo "$value" | jq -r '.status')
            result_sha=$(echo "$value" | jq -r '.commit_sha')
            result_project=$(echo "$value" | jq -r '.webdev_project_id')
            checkpoint_id=$(echo "$value" | jq -r '.checkpoint_id // empty')
            published=$(echo "$value" | jq -r '.published')
            error_code=$(echo "$value" | jq -r '.error_code // empty')

            if [ "$result_status" = "failure" ]; then
              if [[ "$error_code" =~ ^DEFERRED_[A-Z0-9_]+$ ]] &&
                [ "$result_sha" = "$COMMIT_SHA" ] && [ "$result_project" = "$MANUS_WEBDEV_PROJECT_ID" ] &&
                [ -z "$checkpoint_id" ] && [ "$published" = false ]; then
                echo "::warning::Publicação adiada para preservar trabalho no Manus: $error_code."
                {
                  echo '### Manus publication deferred'
                  echo "- Commit pendente: \`$result_sha\`"
                  echo "- Motivo: \`$error_code\`"
                  echo '- Não publicado. Após salvar o trabalho e liberar a sessão Manus, execute este workflow manualmente com o SHA desejado (ou faça um novo push).'
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "::error::Manus informou falha no fluxo WebDev: ${error_code:-sem código}."
              echo "::error::commit=$result_sha project=$result_project published=$published"
              exit 1
            fi

            if [ "$result_status" != "success" ]; then
              echo "::error::Status operacional inesperado: $result_status."
              exit 1
            fi
            if [ "$result_sha" != "$COMMIT_SHA" ]; then
              echo "::error::SHA divergente: esperado=$COMMIT_SHA recebido=$result_sha."
              exit 1
            fi
            if [ "$result_project" != "$MANUS_WEBDEV_PROJECT_ID" ]; then
              echo "::error::Projeto WebDev divergente: esperado=$MANUS_WEBDEV_PROJECT_ID recebido=$result_project."
              exit 1
            fi
            if [ -z "$checkpoint_id" ] || [ "$published" != "true" ]; then
              echo "::error::Resultado de publicação incompleto: checkpoint=$checkpoint_id published=$published."
              exit 1
            fi
            echo "WebDev publication confirmed: commit=$result_sha project=$result_project checkpoint=$checkpoint_id published=$published"
            {
              echo '### Manus publication result'
              echo "- Commit: \`$result_sha\`"
              echo "- WebDev project: \`$result_project\`"
              echo "- Checkpoint: \`$checkpoint_id\`"
              echo "- Published: \`$published\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          for attempt in $(seq 1 150); do
            response=$(curl --fail-with-body --silent --show-error \
              "$MANUS_API_URL/v2/task.listMessages?task_id=$TASK_ID&limit=100&order=desc" \
              -H "x-manus-api-key: $MANUS_API_KEY")
            structured=$(echo "$response" | jq -c --argjson since "$REQUEST_STARTED_AT" '[.messages[] | select(.type == "structured_output_result" and ((.timestamp | tonumber) >= $since)) | .structured_output_result] | first // empty')
            if [ -n "$structured" ]; then
              validate_result "$structured"
            fi

            status_update=$(echo "$response" | jq -c --argjson since "$REQUEST_STARTED_AT" '[.messages[] | select(.type == "status_update" and ((.timestamp | tonumber) >= $since) and .status_update.agent_status != null)] | first // {}')
            status=$(echo "$status_update" | jq -r '.status_update.agent_status // "unknown"')
            brief=$(echo "$status_update" | jq -r '.status_update.brief // empty')
            waiting_type=$(echo "$status_update" | jq -r '.status_update.status_detail.waiting_for_event_type // empty')
            waiting_description=$(echo "$status_update" | jq -r '.status_update.status_detail.waiting_description // empty')
            echo "[$attempt/150] Manus: $status${brief:+ — $brief}${waiting_type:+ [event=$waiting_type]}"

            case "$status" in
              running)
                ;;
              waiting)
                case "$waiting_type" in
                  cascadeJobCall)
                    echo "Technical wait; continuing to poll${waiting_description:+ — $waiting_description}"
                    ;;
                  messageAskUser|cascadeAskUser)
                    echo "::error::A tarefa pediu interação humana ($waiting_type): ${waiting_description:-sem descrição}."
                    exit 1
                    ;;
                  '')
                    echo "::error::A tarefa informou waiting sem waiting_for_event_type; encerrando por segurança."
                    exit 1
                    ;;
                  *)
                    echo "::error::A tarefa está aguardando um evento não automatizável: $waiting_type${waiting_description:+ — $waiting_description}."
                    exit 1
                    ;;
                esac
                ;;
              error)
                echo "::error::A tarefa de sincronização do Manus terminou em erro."
                echo "$response" | jq -r --argjson since "$REQUEST_STARTED_AT" '[.messages[] | select(.type == "error_message" and ((.timestamp | tonumber) >= $since)) | .error_message.content] | first // "Erro sem detalhes adicionais."'
                exit 1
                ;;
              stopped)
                detail=$(curl --fail-with-body --silent --show-error \
                  "$MANUS_API_URL/v2/task.detail?task_id=$TASK_ID" \
                  -H "x-manus-api-key: $MANUS_API_KEY")
                background_jobs=$(echo "$detail" | jq -r 'if (.task | has("has_running_background_jobs")) then (.task.has_running_background_jobs | tostring) else "unknown" end')
                echo "Task stopped sem resultado estruturado novo; background jobs: $background_jobs. Continuando o polling."
                ;;
              *)
                echo "Unknown task status; continuing to poll."
                ;;
            esac
            sleep 20
          done
          echo "::error::Timeout aguardando o resultado estruturado da sincronização/publicação do Manus."
          exit 1
