name: Publish Manus website

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit exato a publicar (opcional; vazio usa o commit do disparo)"
        required: false
        type: string

concurrency:
  group: manus-publish-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-and-publish:
    name: Sync and publish Manus project
    # Checkpoints/publicações do próprio Manus podem gerar um push de volta
    # ao GitHub. Eles já estão publicados e não devem iniciar outro ciclo.
    if: github.actor != 'manus-connector[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MANUS_API_URL: https://api.manus.ai
      # Este é o ID do projeto WebDev, não o ID de um Manus Project.
      MANUS_WEBDEV_PROJECT_ID: NTjLBNvKDjXznaYrpeVMoY
      # ID da sessão persistente que mantém o projeto WebDev anexado.
      # Não é credencial; o acesso continua protegido por MANUS_API_KEY.
      MANUS_WEBDEV_TASK_ID: aG5BaRM3JRZoPIZ0e8Tmf9
      REPOSITORY: desiderati/rac-designer-teto
      BRANCH: main

    steps:
      - name: Validate required secrets
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MANUS_API_KEY" ]; then
            echo "::error::Configure o segredo MANUS_API_KEY em Settings > Secrets and variables > Actions antes de usar a publicação automática."
            exit 1
          fi

      - name: Validate WebDev session
        id: webdev_session
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            "$MANUS_API_URL/v2/website.status?task_id=$MANUS_WEBDEV_TASK_ID" \
            -H "x-manus-api-key: $MANUS_API_KEY")
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            error_code=$(jq -r '(.error.code // "não informado") | tostring | gsub("[^A-Za-z0-9_.-]"; "_") | .[0:120]' "$response_file" 2>/dev/null || echo "resposta_invalida")
            echo "::error::A sessão WebDev não está disponível para a tarefa informada; HTTP $http_status; código: $error_code."
            echo "::error::Projeto esperado: $MANUS_WEBDEV_PROJECT_ID; tarefa configurada: $MANUS_WEBDEV_TASK_ID."
            exit 1
          fi
          website_id=$(jq -r '.website_id // empty' "$response_file")
          if [ -z "$website_id" ]; then
            echo "::error::A tarefa existe, mas não possui um website WebDev anexado."
            echo "::error::Não será executado fetch, build, checkpoint ou publicação."
            exit 1
          fi
          echo "WebDev session validated: task=$MANUS_WEBDEV_TASK_ID website=$website_id project=$MANUS_WEBDEV_PROJECT_ID"
          echo "website_id=$website_id" >> "$GITHUB_OUTPUT"

      - name: Request Manus sync and publication
        id: manus_task
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual publication' }}
        shell: bash
        run: |
          set -euo pipefail
          result_schema=$(cat <<'JSON'
          {
            "type": "object",
            "properties": {
              "status": {"type": "string", "enum": ["success", "failure"]},
              "commit_sha": {"type": "string"},
              "webdev_project_id": {"type": "string"},
              "checkpoint_id": {"type": ["string", "null"]},
              "published": {"type": "boolean"},
              "error_code": {"type": ["string", "null"]}
            },
            "required": ["status", "commit_sha", "webdev_project_id", "checkpoint_id", "published", "error_code"],
            "additionalProperties": false
          }
          JSON
          )
          prompt=$(cat <<EOF
          Esta é uma sessão WebDev existente e já validada pelo workflow.
          Projeto WebDev obrigatório: ${MANUS_WEBDEV_PROJECT_ID}
          Tarefa/sessão WebDev: ${MANUS_WEBDEV_TASK_ID}
          Repositório fonte: ${REPOSITORY}
          Branch: ${BRANCH}
          Commit obrigatório: ${COMMIT_SHA}
          Mensagem do commit: ${COMMIT_MESSAGE}
          Diretório do projeto WebDev: /home/ubuntu/editor-planta-baixa

          Execute exatamente este fluxo, sem pedir confirmação e sem criar alterações de produto:
          1. Antes de qualquer operação Git, execute webdev_check_status e confirme que a sessão atual está anexada ao projeto WebDev ${MANUS_WEBDEV_PROJECT_ID}, no diretório /home/ubuntu/editor-planta-baixa. Se o projeto não estiver anexado, ou o projectId/path não corresponderem, não inicialize projeto novo, não use webdev_init_project, não faça fetch e não crie checkpoint; encerre com status failure e error_code WEBDEV_PROJECT_NOT_ATTACHED.
          2. Faça fetch do remoto user_github para a branch main.
          3. Verifique que o SHA de user_github/main corresponde ao commit obrigatório ${COMMIT_SHA}. Se não corresponder, faça fetch novamente e interrompa com status failure se o SHA não puder ser confirmado.
          4. Alinhe o checkout ao SHA obrigatório com git reset --hard ${COMMIT_SHA}. Preserve arquivos locais de infraestrutura do WebDev que não são rastreados pelo Git; não use git clean.
          5. Execute pnpm check e pnpm build. Se qualquer validação falhar, não publique e retorne status failure.
          6. Salve um checkpoint do projeto WebDev ${MANUS_WEBDEV_PROJECT_ID} com uma mensagem que contenha o SHA ${COMMIT_SHA} e indique que a origem foi um push do GitHub.
          7. Confirme o identificador do checkpoint e que a publicação foi iniciada ou concluída pelo WebDev. Não declare published=true sem evidência do WebDev.

          Não faça commit, push, alterações cosméticas, migrações ou mudanças fora desse fluxo.
          Ao terminar, produza um resultado estruturado com exatamente estes campos:
          status, commit_sha, webdev_project_id, checkpoint_id, published, error_code.
          Para sucesso, use status=success, commit_sha=${COMMIT_SHA}, webdev_project_id=${MANUS_WEBDEV_PROJECT_ID}, checkpoint_id preenchido, published=true e error_code=null.
          Para falha, use status=failure, published=false e um error_code curto.
          EOF
          )
          payload=$(jq -n \
            --arg task_id "$MANUS_WEBDEV_TASK_ID" \
            --arg content "$prompt" \
            --argjson schema "$result_schema" \
            '{
              task_id: $task_id,
              message: {content: $content},
              structured_output_schema: $schema
            }')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            -X POST "$MANUS_API_URL/v2/task.sendMessage" \
            -H "x-manus-api-key: $MANUS_API_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload")
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            error_code=$(jq -r '(.error.code // "não informado") | tostring | gsub("[^A-Za-z0-9_.-]"; "_") | .[0:120]' "$response_file" 2>/dev/null || echo "resposta_invalida")
            request_id=$(jq -r '(.request_id // "não informado") | tostring | gsub("[^A-Za-z0-9_.-]"; "_") | .[0:120]' "$response_file" 2>/dev/null || echo "resposta_invalida")
            echo "::error::Manus retornou HTTP $http_status ao retomar a sessão WebDev; código: $error_code; request_id: $request_id."
            exit 1
          fi
          task_id=$(jq -er '.task_id' "$response_file")
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "Resumed WebDev task: $task_id"

      - name: Wait for Manus publication
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          TASK_ID: ${{ steps.manus_task.outputs.task_id }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          finalization_attempts=0
          for attempt in $(seq 1 135); do
            response=$(curl --fail-with-body --silent --show-error \
              "$MANUS_API_URL/v2/task.listMessages?task_id=$TASK_ID&limit=100&order=desc" \
              -H "x-manus-api-key: $MANUS_API_KEY")
            status_update=$(echo "$response" | jq -c '[.messages[] | select(.type == "status_update" and .status_update.agent_status != null)] | first // {}')
            status=$(echo "$status_update" | jq -r '.status_update.agent_status // "unknown"')
            brief=$(echo "$status_update" | jq -r '.status_update.brief // empty')
            waiting_type=$(echo "$status_update" | jq -r '.status_update.status_detail.waiting_for_event_type // empty')
            waiting_description=$(echo "$status_update" | jq -r '.status_update.status_detail.waiting_description // empty')
            echo "[$attempt/135] Manus: $status${brief:+ — $brief}${waiting_type:+ [event=$waiting_type]}"

            case "$status" in
              running)
                ;;
              waiting)
                case "$waiting_type" in
                  cascadeJobCall)
                    echo "Technical wait; continuing to poll${waiting_description:+ — $waiting_description}"
                    ;;
                  messageAskUser|cascadeAskUser)
                    echo "::error::A tarefa pediu interação humana ($waiting_type): ${waiting_description:-sem descrição}."
                    exit 1
                    ;;
                  '')
                    echo "::error::A tarefa informou waiting sem waiting_for_event_type; encerrando por segurança."
                    exit 1
                    ;;
                  *)
                    echo "::error::A tarefa está aguardando um evento não automatizável: $waiting_type${waiting_description:+ — $waiting_description}."
                    exit 1
                    ;;
                esac
                ;;
              error)
                echo "::error::A tarefa de sincronização do Manus terminou em erro."
                echo "$response" | jq -r '[.messages[] | select(.type == "error_message") | .error_message.content] | first // "Erro sem detalhes adicionais."'
                exit 1
                ;;
              stopped)
                detail=$(curl --fail-with-body --silent --show-error \
                  "$MANUS_API_URL/v2/task.detail?task_id=$TASK_ID" \
                  -H "x-manus-api-key: $MANUS_API_KEY")
                background_jobs=$(echo "$detail" | jq -r 'if (.task | has("has_running_background_jobs")) then (.task.has_running_background_jobs | tostring) else "unknown" end')
                if [ "$background_jobs" = "true" ]; then
                  echo "Main agent stopped, but background jobs remain; continuing to poll."
                elif [ "$background_jobs" = "unknown" ]; then
                  echo "Main agent stopped, but background-job state is unknown; continuing to poll."
                else
                  finalization_attempts=$((finalization_attempts + 1))
                  structured=$(echo "$response" | jq -c '[.messages[] | select(.type == "structured_output_result") | .structured_output_result] | first // empty')
                  if [ -z "$structured" ]; then
                    if [ "$finalization_attempts" -lt 6 ]; then
                      echo "Task stopped without structured result; waiting for extraction (${finalization_attempts}/5)."
                    else
                      echo "::error::A tarefa parou sem produzir o resultado estruturado esperado."
                      exit 1
                    fi
                  else
                    success=$(echo "$structured" | jq -r '.success // false')
                    if [ "$success" != "true" ]; then
                      echo "::error::A extração do resultado estruturado falhou."
                      echo "$structured" | jq -r '.error // "Erro sem detalhes adicionais."'
                      exit 1
                    fi
                    value=$(echo "$structured" | jq -c '.value')
                    result_status=$(echo "$value" | jq -r '.status // empty')
                    result_sha=$(echo "$value" | jq -r '.commit_sha // empty')
                    result_project=$(echo "$value" | jq -r '.webdev_project_id // empty')
                    checkpoint_id=$(echo "$value" | jq -r '.checkpoint_id // empty')
                    published=$(echo "$value" | jq -r '.published // false')
                    error_code=$(echo "$value" | jq -r '.error_code // empty')
                    if [ "$result_status" != "success" ] || [ "$result_sha" != "$COMMIT_SHA" ] || [ "$result_project" != "$MANUS_WEBDEV_PROJECT_ID" ] || [ -z "$checkpoint_id" ] || [ "$published" != "true" ]; then
                      echo "::error::Resultado WebDev inválido ou incompleto: status=$result_status sha=$result_sha project=$result_project checkpoint=$checkpoint_id published=$published error_code=$error_code"
                      exit 1
                    fi
                    echo "WebDev publication confirmed: commit=$result_sha project=$result_project checkpoint=$checkpoint_id published=$published"
                    {
                      echo '### Manus publication result'
                      echo "- Commit: \\`$result_sha\\`"
                      echo "- WebDev project: \\`$result_project\\`"
                      echo "- Checkpoint: \\`$checkpoint_id\\`"
                      echo "- Published: \\`$published\\`"
                    } >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                fi
                ;;
              *)
                echo "Unknown task status; continuing to poll."
                ;;
            esac
            sleep 20
          done
          echo "::error::Timeout aguardando a sincronização/publicação do Manus."
          exit 1
